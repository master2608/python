<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Figurinhas{% endblock %} - Copa do Mundo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        h1 { color: #1a3c6e; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #1a3c6e; color: white; }
        .btn { display: inline-block; padding: 8px 14px; background: #1a3c6e; color: white;
               text-decoration: none; border-radius: 4px; }
        .form-grupo { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        select, input[type=text] { padding: 6px; width: 300px; }
        button { padding: 8px 16px; background: #2e7d32; color: white; border: none;
                 border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
