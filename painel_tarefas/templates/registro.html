{% extends 'base.html' %}
{% block titulo %}Criar Conta - Painel de Tarefas{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h3 class="text-center mb-4"><i class="bi bi-person-plus"></i> Criar Conta</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" name="nome" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="senha" class="form-control" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Cadastrar</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Já tem conta? <a href="{{ url_for('login') }}">Faça login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
